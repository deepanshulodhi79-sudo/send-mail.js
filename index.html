<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mail Sender</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #f4f6f8;
    margin: 0;
    padding: 40px 16px;
    display: flex;
    justify-content: center;
  }
  .card {
    background: #fff;
    max-width: 520px;
    width: 100%;
    padding: 32px;
    border-radius: 12px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.08);
  }
  h1 {
    font-size: 22px;
    margin-bottom: 4px;
    color: #1a1a1a;
  }
  p.sub {
    color: #666;
    margin-top: 0;
    margin-bottom: 20px;
    font-size: 14px;
  }
  fieldset {
    border: 1px solid #eee;
    border-radius: 10px;
    padding: 16px;
    margin: 0 0 20px 0;
  }
  legend {
    font-size: 13px;
    font-weight: 700;
    color: #d93025;
    padding: 0 6px;
  }
  label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 6px;
    color: #333;
  }
  .hint {
    font-size: 12px;
    color: #888;
    margin: -14px 0 14px 0;
  }
  input, textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 14px;
    margin-bottom: 14px;
    font-family: inherit;
  }
  textarea { min-height: 90px; resize: vertical; }
  #receivers { min-height: 80px; font-family: monospace; }
  button {
    width: 100%;
    padding: 12px;
    background: #d93025;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  #status {
    margin-top: 16px;
    font-size: 13px;
    padding: 10px;
    border-radius: 8px;
    display: none;
    white-space: pre-wrap;
  }
  .ok { background: #e6f4ea; color: #137333; }
  .err { background: #fce8e6; color: #c5221f; }
</style>
</head>
<body>
  <div class="card">
    <h1>📧 Mail Sender</h1>
    <p class="sub">Apni Gmail ID aur App Password se, ek ya kai logon ko mail bhejein</p>

    <form id="mailForm">
      <fieldset>
        <legend>Sender (Aapki details)</legend>

        <label for="senderName">Sender Name</label>
        <input type="text" id="senderName" placeholder="e.g. Rahul Kumar">

        <label for="senderEmail">Sender Gmail ID</label>
        <input type="email" id="senderEmail" required placeholder="youremail@gmail.com">

        <label for="appPassword">App Password</label>
        <input type="password" id="appPassword" required placeholder="16-digit app password" autocomplete="off">
        <div class="hint">Ye password sirf is request ke liye use hota hai, server par store nahi hota.</div>
      </fieldset>

      <fieldset>
        <legend>Receivers</legend>

        <label for="receivers">Client/Receiver ki Email ID (ek line mein ek email)</label>
        <textarea id="receivers" required placeholder="client1@example.com&#10;client2@example.com&#10;client3@example.com"></textarea>
        <div class="hint">Comma se bhi separate kar sakte hain, ya har ek ko naye line mein likhein.</div>
      </fieldset>

      <fieldset>
        <legend>Mail Content</legend>

        <label for="subject">Subject</label>
        <input type="text" id="subject" required placeholder="Mail ka subject">

        <label for="message">Message</label>
        <textarea id="message" required placeholder="Apna message yahan likhein"></textarea>
      </fieldset>

      <button type="submit" id="sendBtn">Mail Bhejein</button>
    </form>

    <div id="status"></div>
  </div>

  <script>
    const form = document.getElementById('mailForm');
    const btn = document.getElementById('sendBtn');
    const status = document.getElementById('status');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      btn.disabled = true;
      btn.textContent = 'Bhej rahe hain...';
      status.style.display = 'none';

      const senderName = document.getElementById('senderName').value;
      const senderEmail = document.getElementById('senderEmail').value;
      const appPassword = document.getElementById('appPassword').value;
      const to = document.getElementById('receivers').value;
      const subject = document.getElementById('subject').value;
      const message = document.getElementById('message').value;

      try {
        const res = await fetch('/api/send-mail', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ senderName, senderEmail, appPassword, to, subject, message }),
        });
        const data = await res.json();

        status.style.display = 'block';
        if (data.success) {
          status.className = 'ok';
          status.textContent = `✅ ${data.totalSent} mail(s) successfully bhej diya gaya!\n` + data.sent.join(', ');
        } else if (data.totalSent !== undefined) {
          status.className = 'err';
          status.textContent =
            `⚠️ ${data.totalSent} bhej gaya, ${data.totalFailed} fail hua.\n` +
            data.failed.map((f) => `${f.email}: ${f.error}`).join('\n');
        } else {
          status.className = 'err';
          status.textContent = '❌ Error: ' + data.error;
        }
      } catch (err) {
        status.style.display = 'block';
        status.className = 'err';
        status.textContent = '❌ Kuch galat ho gaya: ' + err.message;
      } finally {
        btn.disabled = false;
        btn.textContent = 'Mail Bhejein';
      }
    });
  </script>
</body>
</html>
